---
name: Test Action

on: [push, workflow_dispatch]

jobs:
  test_action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        psr-version: ["8.7.0", "9.21.2", "10.6.1"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: ./action
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          repository: zckv/semantic-versioning-example
          path: ./pyproject
      - uses: ./action
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          root_options: -v --noop
          directory: ./pyproject
          commit: false
          push: false
          changelog: false
          vcs_release: false
          psr_version: ${{ matrix.psr-version }}
